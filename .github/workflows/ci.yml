name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run release:check
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
      - run: npx tfx extension create --manifest-globs vss-extension.json --output-path ./out
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: out/*.vsix
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
